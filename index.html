<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a2e">
<title>WIP Scanner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1c1c1c; --muted: #6b6b6b;
    --line: #dedbd4; --brand: #1f3a2e; --brand-ink: #ffffff; --accent: #c8702a;
    --warn-bg: #fff4e0; --warn-ink: #7a4a00; --ok-bg: #e6f2ea; --ok-ink: #1f5a36;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141614; --card: #1f221f; --ink: #ecebe7; --muted: #a3a39c;
      --line: #343834; --brand: #3f7a5c; --brand-ink: #ffffff; --accent: #e08a45;
      --warn-bg: #3a2c12; --warn-ink: #ffd89a; --ok-bg: #173323; --ok-ink: #9fdcb5;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 1000; background: var(--brand); color: var(--brand-ink);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header span { font-size: 14px; opacity: .85; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .big-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    min-height: 72px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 20px; font-weight: 700;
    border: 0; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .big-btn:active { transform: scale(.98); }
  .big-btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  button { font: inherit; min-height: 48px; padding: 0 16px; border-radius: 10px; border: 0;
    background: var(--brand); color: var(--brand-ink); font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.small { min-height: 38px; padding: 0 12px; font-size: 14px; }
  button.danger { background: transparent; color: #c0392b; border: 1px solid currentColor; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  label.field { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  input[type=text] { font: inherit; font-size: 18px; padding: 12px; border-radius: 10px; width: 100%;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  #ilo { font-size: 30px; font-weight: 700; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .ilo-wrap { display: flex; align-items: center; gap: 8px; }
  .ilo-wrap b { font-size: 26px; }
  #review { display: grid; gap: 12px; }
  #preview { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; background: #0002; }
  .pill { padding: 8px 12px; border-radius: 8px; font-size: 14px; }
  .pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .pill.info { background: var(--bg); color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { min-height: 36px; font-size: 15px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  #map { height: 340px; border-radius: 12px; border: 1px solid var(--line); z-index: 0; }
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .list-head h2 { font-size: 17px; margin: 0; }
  ul#list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  ul#list li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
  ul#list li .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  ul#list li .num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  ul#list li .meta { font-size: 13px; color: var(--muted); }
  ul#list li .acts { display: flex; gap: 8px; margin-top: 4px; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .ilo-tip { font-weight: 700; font-size: 12px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 16px 24px; }
</style>
</head>
<body>
<header>
  <h1>WIP Scanner</h1>
  <span id="count">0 scanned</span>
</header>

<main>
  <label class="big-btn" id="scanBtn" for="cam">📷 Scan label</label>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden>

  <section id="review" class="card" hidden>
    <img id="preview" alt="Captured label">
    <div id="ocrStatus" class="pill info">Reading label…</div>
    <div id="candidates" class="chips" hidden></div>
    <label class="field">ILO number
      <div class="ilo-wrap"><b>ILO</b><input id="ilo" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000"></div>
    </label>
    <div class="row" style="align-items:center">
      <div id="gpsStatus" class="pill info" style="flex:1 1 60%">Getting location…</div>
      <button id="gpsRetry" class="secondary small" style="flex:0 0 auto" hidden>Retry GPS</button>
    </div>
    <label class="field">Note (optional)
      <input id="note" type="text" placeholder="e.g. Bay 3, second stack">
    </label>
    <div class="row">
      <button id="saveBtn">Add to list</button>
      <button id="discardBtn" class="secondary">Discard</button>
    </div>
  </section>

  <div id="map"></div>

  <section class="card">
    <div class="list-head">
      <h2>Scanned plots</h2>
      <div class="row" style="flex:0 0 auto">
        <button id="exportBtn" class="small">Export CSV</button>
        <button id="clearBtn" class="small danger">Clear</button>
      </div>
    </div>
    <ul id="list"></ul>
  </section>
</main>
<footer>Photos are read on this phone and never uploaded. The list is saved on this phone only until you export it.</footer>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(() => {
  const STORE_KEY = 'wipScanner.v1';
  const $ = id => document.getElementById(id);

  // ---------- storage (phone only) ----------
  let items = [];
  try { items = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { items = []; }
  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(items)); } catch { /* private mode etc. */ }
  }

  // ---------- map ----------
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxNativeZoom: 19, maxZoom: 21, attribution: 'Imagery &copy; Esri' });
  const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxNativeZoom: 19, maxZoom: 21, attribution: '&copy; OpenStreetMap contributors' });
  const map = L.map('map', { layers: [satellite], zoomControl: true }).setView([54.5, -2.5], 5);
  L.control.layers({ 'Satellite': satellite, 'Map': streets }).addTo(map);
  const markerLayer = L.layerGroup().addTo(map);
  let pendingMarker = null;
  const markers = new Map();

  function drawMarkers(fit) {
    markerLayer.clearLayers(); markers.clear();
    const pts = [];
    for (const it of items) {
      if (it.lat == null) continue;
      const m = L.circleMarker([it.lat, it.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#c8702a', fillOpacity: 1 })
        .bindTooltip(it.ilo, { permanent: true, direction: 'top', offset: [0, -8], className: 'ilo-tip' })
        .bindPopup(`<b>ILO ${esc(it.ilo)}</b><br>${esc(fmtTime(it.ts))}${it.note ? '<br>' + esc(it.note) : ''}<br>±${it.acc} m`);
      m.addTo(markerLayer); markers.set(it.id, m); pts.push([it.lat, it.lng]);
    }
    if (fit && pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 19 });
  }

  // ---------- list ----------
  function render(fit) {
    $('count').textContent = `${items.length} scanned`;
    const ul = $('list'); ul.innerHTML = '';
    if (!items.length) { ul.innerHTML = '<li class="empty" style="border:0">Nothing scanned yet. Tap “Scan label” to start.</li>'; }
    for (const it of [...items].reverse()) {
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="top"><span class="num">ILO ${esc(it.ilo)}</span><span class="meta">${esc(fmtTime(it.ts))}</span></div>
        ${it.note ? `<div>${esc(it.note)}</div>` : ''}
        <div class="meta">${it.lat != null ? `${it.lat.toFixed(6)}, ${it.lng.toFixed(6)} · ±${it.acc} m` : 'No location recorded'}</div>
        <div class="acts">
          ${it.lat != null ? '<button class="small secondary" data-act="show">Show on map</button>' : ''}
          <button class="small danger" data-act="del">Delete</button>
        </div>`;
      li.addEventListener('click', e => {
        const act = e.target.dataset && e.target.dataset.act;
        if (act === 'show') { map.setView([it.lat, it.lng], 19); markers.get(it.id)?.openPopup(); $('map').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        if (act === 'del' && confirm(`Delete ILO ${it.ilo} from the list?`)) { items = items.filter(x => x.id !== it.id); persist(); render(); }
      });
      ul.appendChild(li);
    }
    drawMarkers(fit);
  }

  // ---------- OCR ----------
  let workerPromise = null;
  function getWorker() {
    if (!workerPromise) {
      workerPromise = Tesseract.createWorker('eng', 1, {
        logger: m => { if (m.status === 'recognizing text') setOcr('info', `Reading label… ${Math.round(m.progress * 100)}%`); }
      });
    }
    return workerPromise;
  }

  // Scale down + greyscale + stretch contrast: faster and more accurate on phone photos.
  async function prepImage(file) {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1800, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data;
    let lo = 255, hi = 0;
    for (let i = 0; i < px.length; i += 4) {
      const g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
      px[i] = g; if (g < lo) lo = g; if (g > hi) hi = g;
    }
    const range = Math.max(1, hi - lo);
    for (let i = 0; i < px.length; i += 4) { const g = (px[i] - lo) * 255 / range; px[i] = px[i + 1] = px[i + 2] = g; }
    ctx.putImageData(d, 0, 0);
    return { canvas: c, url };
  }

  // Pull the ILO number out of the OCR text, allowing for common misreads (1/l/| for I, 0/Q for O).
  function findIlo(text) {
    const t = text.toUpperCase().replace(/[|!]/g, 'I');
    const found = [];
    const re = /[I1LT][L1I][O0QD]\W{0,3}((?:\d\s?){6})/g;
    let m;
    while ((m = re.exec(t))) found.push(m[1].replace(/\s/g, ''));
    if (found.length) return { best: found[0], all: [...new Set(found)], sure: true };
    const loose = [...new Set((t.match(/\b\d{6}\b/g) || []))];
    return { best: loose[0] || '', all: loose, sure: false };
  }

  // ---------- GPS: watch for a few seconds and keep the most accurate fix ----------
  let gps = null, gpsWatch = null, gpsTimer = null;
  function startGps() {
    gps = null; stopGps();
    $('gpsRetry').hidden = true;
    if (!('geolocation' in navigator)) { setGps('warn', 'Location not available on this browser'); return; }
    setGps('info', 'Getting location…');
    gpsWatch = navigator.geolocation.watchPosition(p => {
      const fix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) };
      if (!gps || fix.acc < gps.acc) { gps = fix; showPending(); }
      setGps(gps.acc <= 15 ? 'ok' : 'warn', `Location ±${gps.acc} m${gps.acc > 15 ? ' (improving…)' : ''}`);
      if (gps.acc <= 5) stopGps(true);
    }, err => {
      setGps('warn', err.code === 1 ? 'Location blocked. Allow location for this site in your browser settings.' : 'Couldn’t get location: ' + err.message);
      $('gpsRetry').hidden = false;
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
    gpsTimer = setTimeout(() => stopGps(true), 15000);
  }
  function stopGps(done) {
    if (gpsWatch != null) navigator.geolocation.clearWatch(gpsWatch);
    gpsWatch = null; clearTimeout(gpsTimer);
    if (done) { $('gpsRetry').hidden = false; if (gps) setGps(gps.acc <= 15 ? 'ok' : 'warn', `Location ±${gps.acc} m`); }
  }
  function showPending() {
    if (!gps) return;
    if (pendingMarker) pendingMarker.remove();
    pendingMarker = L.circle([gps.lat, gps.lng], { radius: gps.acc, color: '#2d7ff9', weight: 2, fillOpacity: .15 }).addTo(map);
    map.setView([gps.lat, gps.lng], Math.max(map.getZoom(), 18));
  }

  // ---------- capture flow ----------
  let current = null;
  $('cam').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (file) handlePhoto(file);
  });

  async function handlePhoto(file) {
    startGps();
    $('review').hidden = false;
    $('ilo').value = ''; $('note').value = '';
    $('candidates').hidden = true;
    $('scanBtn').setAttribute('aria-disabled', 'true');
    setOcr('info', 'Reading label…');
    $('review').scrollIntoView({ behavior: 'smooth', block: 'start' });
    try {
      const { canvas, url } = await prepImage(file);
      if (current?.url) URL.revokeObjectURL(current.url);
      current = { url };
      $('preview').src = url;
      const worker = await getWorker();
      const { data } = await worker.recognize(canvas);
      const r = findIlo(data.text || '');
      $('ilo').value = r.best;
      if (r.best && r.sure) setOcr('ok', 'Found the ILO number. Check it matches the label.');
      else if (r.best) setOcr('warn', 'Not sure this is the ILO number. Please check it.');
      else setOcr('warn', 'Couldn’t read the number. Type it in, or discard and retake closer and straight on.');
      if (r.all.length > 1) {
        const box = $('candidates'); box.innerHTML = ''; box.hidden = false;
        r.all.forEach(n => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { $('ilo').value = n; }; box.appendChild(b); });
      }
    } catch (err) {
      console.error(err);
      setOcr('warn', 'Couldn’t read the photo. Type the number in, or check you have signal (the reader downloads once on first use).');
    } finally {
      $('scanBtn').removeAttribute('aria-disabled');
    }
  }

  $('saveBtn').addEventListener('click', () => {
    const ilo = $('ilo').value.replace(/\D/g, '');
    if (ilo.length !== 6) { alert('ILO number should be 6 digits.'); $('ilo').focus(); return; }
    if (!gps && !confirm('No location yet. Save without a location?')) return;
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ilo, ts: new Date().toISOString(), note: $('note').value.trim(),
      lat: gps ? gps.lat : null, lng: gps ? gps.lng : null, acc: gps ? gps.acc : null
    };
    const existing = items.find(x => x.ilo === ilo);
    if (existing) {
      if (!confirm(`ILO ${ilo} is already on the list. Replace it with this new scan and location?`)) return;
      items = items.filter(x => x.ilo !== ilo);
    }
    items.push(entry); persist();
    closeReview(); render();
    if (entry.lat != null) { map.setView([entry.lat, entry.lng], 19); markers.get(entry.id)?.openPopup(); }
  });
  $('discardBtn').addEventListener('click', closeReview);
  $('gpsRetry').addEventListener('click', startGps);
  $('ilo').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });

  function closeReview() {
    stopGps(); gps = null;
    if (pendingMarker) { pendingMarker.remove(); pendingMarker = null; }
    $('review').hidden = true;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- export ----------
  $('exportBtn').addEventListener('click', async () => {
    if (!items.length) { alert('Nothing to export yet.'); return; }
    const head = ['ILO', 'Scanned', 'Latitude', 'Longitude', 'Accuracy (m)', 'Note', 'Map link'];
    const rows = items.map(it => [
      'ILO ' + it.ilo, fmtTime(it.ts), it.lat ?? '', it.lng ?? '', it.acc ?? '', it.note || '',
      it.lat != null ? `https://www.google.com/maps?q=${it.lat},${it.lng}` : ''
    ]);
    const csv = [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
    const name = `WIP scan ${new Date().toISOString().slice(0, 16).replace('T', ' ').replace(':', '')}.csv`;
    const file = new File(['﻿' + csv], name, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'WIP scan' }); return; }
      catch (err) { if (err.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });

  $('clearBtn').addEventListener('click', () => {
    if (!items.length) return;
    if (!confirm(`Clear all ${items.length} scans from this phone? Export first if you need them.`)) return;
    items = []; persist(); render();
  });

  // ---------- helpers ----------
  function setOcr(kind, msg) { const el = $('ocrStatus'); el.className = 'pill ' + kind; el.textContent = msg; }
  function setGps(kind, msg) { const el = $('gpsStatus'); el.className = 'pill ' + kind; el.textContent = msg; }
  function fmtTime(iso) { return new Date(iso).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  function csvCell(v) { v = String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // Warm the OCR reader in the background so the first scan is quicker.
  setTimeout(() => getWorker().catch(() => {}), 1500);

  window.__wip = { handlePhoto, findIlo }; // for testing
  render(true);
})();
</script>
</body>
</html>
